name: CI / Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and verify modpack
        uses: ./.github/actions/build-pack
        with:
          output-directory: ${{ runner.temp }}/build
      - name: Confirm independent rebuild preserves references and settings
        run: |
          python3 scripts/native_pack.py --output "$RUNNER_TEMP/rebuild" --packwiz "$RUNNER_TEMP/tools/packwiz"
          python3 - <<'PY'
          import os, pathlib
          a=pathlib.Path(os.environ['RUNNER_TEMP'])/'build'
          b=a.parent/'rebuild'
          import json, sys
          sys.path.insert(0, 'scripts')
          import native_pack
          native_pack.compare_builds(a, b)
          PY
      - name: Save reviewable generated ZIPs and receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okd-native-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build/
          retention-days: 14
          if-no-files-found: error
