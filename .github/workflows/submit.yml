name: Release / Submit
on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Verify exact saved ZIPs, then await Environment approval before submitting'
        type: boolean
        default: false
        required: true
      artifact_source:
        description: 'Reuse published bytes for resume; build only for a new version without an existing Release'
        type: choice
        options: [published_release, new_build]
        default: published_release
      mode:
        description: 'Submit both files or only server with recorded/verified client'
        type: choice
        options: [client_server, server_only]
        default: client_server
      existing_client_file_id:
        description: 'Optional publicly approved client ID for recovery (exact bytes required)'
        type: string
        default: ''
      manual_release:
        description: 'Hold accepted files for manual publication after moderation'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: curseforge-submit
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read # Read Environment protection rules before requesting approval
    outputs:
      client_artifact_id: ${{ steps.client.outputs.artifact-id }}
      server_artifact_id: ${{ steps.server.outputs.artifact-id }}
      report_artifact_id: ${{ steps.report.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require reviewer approval for publication
        if: inputs.submit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/curseforge" --jq '.protection_rules' > "$RUNNER_TEMP/protection-rules.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rules = json.loads((Path(os.environ['RUNNER_TEMP']) / 'protection-rules.json').read_text())
          if not any(rule.get('type') == 'required_reviewers' and rule.get('reviewers') for rule in rules):
              raise SystemExit('Configure required reviewers on the curseforge Environment before submitting.')
          PY
      - name: Require a new version before rebuilding
        if: inputs.artifact_source == 'new_build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/published_pack.py --require-new-version
      - name: Build and verify a new version
        if: inputs.artifact_source == 'new_build'
        id: verify
        uses: ./.github/actions/build-pack
        with:
          output-directory: ${{ runner.temp }}/verified
      - name: Acquire exact published release without rebuilding
        if: inputs.artifact_source == 'published_release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 scripts/published_pack.py --output "$RUNNER_TEMP/verified"
          VERSION=$(python3 -c 'import json; print(json.load(open("pack/release.json"))["version"])')
          python3 scripts/publish_pair.py --client "$RUNNER_TEMP/verified/okd-server-modpack-${VERSION}.zip" --client-receipt "$RUNNER_TEMP/verified/client.json" --server "$RUNNER_TEMP/verified/okd-server-modpack-${VERSION}-serverpack.zip" --server-receipt "$RUNNER_TEMP/verified/server.json" --release-receipt "$RUNNER_TEMP/verified/github-release-receipt.json" --published-release --receipt "$RUNNER_TEMP/verified/plan.json"
      - name: Expose exact selected client filename
        id: selected
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("pack/release.json"))["version"])')
          echo "client_zip=$RUNNER_TEMP/verified/okd-server-modpack-${VERSION}.zip" >> "$GITHUB_OUTPUT"
      - name: Save exact client ZIP
        id: client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.selected.outputs.client_zip }}
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Save exact server setup ZIP
        id: server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/verified/*-serverpack.zip
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Save sanitized reports
        id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: okd-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verified/server.json
            ${{ runner.temp }}/verified/plan.json
            ${{ runner.temp }}/verified/client.json
            ${{ runner.temp }}/verified/github-release-receipt.json
            ${{ runner.temp }}/verified/acquisition.json
          retention-days: 14
          if-no-files-found: error
      - name: Link exact artifacts for approval
        env:
          CLIENT_URL: ${{ steps.client.outputs.artifact-url }}
          SERVER_URL: ${{ steps.server.outputs.artifact-url }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            echo '## Review these artifacts before approving the curseforge deployment'
            echo "Workflow commit: $GITHUB_SHA"
            RELEASE_SOURCE=$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "verified", "github-release-receipt.json")))["source_commit"])')
            echo "Release source commit: $RELEASE_SOURCE"
            echo "- [Client ZIP]($CLIENT_URL)"
            echo "- [Server ZIP]($SERVER_URL)"
            echo "- [Validation reports]($REPORT_URL)"
            echo 'Approval submits these exact artifacts; no rebuild is performed.'
          } >> "$GITHUB_STEP_SUMMARY"
  submit:
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.submit
    environment: curseforge
    permissions:
      contents: write # Release ZIPs + immutable submission journal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require this run's artifact IDs
        env:
          CLIENT_ID: ${{ needs.preflight.outputs.client_artifact_id }}
          SERVER_ID: ${{ needs.preflight.outputs.server_artifact_id }}
          REPORT_ID: ${{ needs.preflight.outputs.report_artifact_id }}
        run: |
          [[ "$CLIENT_ID" =~ ^[1-9][0-9]*$ && "$SERVER_ID" =~ ^[1-9][0-9]*$ && "$REPORT_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.preflight.outputs.client_artifact_id }},${{ needs.preflight.outputs.server_artifact_id }}
          path: ${{ runner.temp }}/submission/
          skip-decompress: true
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.preflight.outputs.report_artifact_id }}
          path: ${{ runner.temp }}/reports/
          digest-mismatch: error
      - name: Recheck exact bytes and publish with durable duplicate prevention
        env:
          CURSEFORGE_SUBMISSION_ENABLED: ${{ vars.CURSEFORGE_SUBMISSION_ENABLED }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXISTING_CLIENT: ${{ inputs.existing_client_file_id }}
          MANUAL_RELEASE: ${{ inputs.manual_release }}
          ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("pack/release.json"))["version"])')
          CLIENT_NAME="okd-server-modpack-${VERSION}.zip"
          EXTRA=()
          if [[ "$ARTIFACT_SOURCE" == published_release ]]; then EXTRA+=(--published-release); fi
          if [[ -n "$EXISTING_CLIENT" ]]; then
            [[ "$EXISTING_CLIENT" =~ ^[1-9][0-9]*$ ]] || exit 1
            EXTRA+=(--existing-client-file-id "$EXISTING_CLIENT")
          fi
          if [[ "$MANUAL_RELEASE" == true ]]; then EXTRA+=(--manual-release); fi
          python3 scripts/publish_pair.py --client "$RUNNER_TEMP/submission/$CLIENT_NAME" --client-receipt "$RUNNER_TEMP/reports/client.json" --server "$RUNNER_TEMP/submission/okd-server-modpack-${VERSION}-serverpack.zip" --server-receipt "$RUNNER_TEMP/reports/server.json" --release-receipt "$RUNNER_TEMP/reports/github-release-receipt.json" --receipt "$RUNNER_TEMP/submission-result.json" --mode "$MODE" "${EXTRA[@]}" --submit
      - name: Preserve receipt even if acceptance is uncertain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: okd-submission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/submission-result.json
          retention-days: 14
          if-no-files-found: warn
  verify-publication:
    needs: submit
    if: github.ref == 'refs/heads/main' && inputs.submit && needs.submit.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-publication.yml
